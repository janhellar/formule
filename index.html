<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Formule &mdash; Pen &amp; Paper Racer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 14px; background: rgba(15, 23, 42, 0.92);
    color: #fff; z-index: 10; backdrop-filter: blur(4px);
  }
  #turnIndicator { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  #turnDot {
    width: 14px; height: 14px; border-radius: 50%; background: #2563eb;
    box-shadow: 0 0 8px 1px currentColor; flex-shrink: 0;
    transition: background-color 0.15s;
  }
  #restartBtn {
    background: #334155; color: #fff; border: none; padding: 8px 16px;
    border-radius: 8px; font-size: 14px; font-weight: 600;
  }
  #restartBtn:active { background: #475569; }

  #canvasWrap {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hint {
    position: fixed; top: 56px; left: 0; right: 0; bottom: 0;
    background: rgba(15, 23, 42, 0.88); color: #fff; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px; gap: 14px;
  }
  #hint h2 { margin: 0; font-size: 22px; }
  #hint p { margin: 0; font-size: 15px; line-height: 1.55; color: #cbd5e1; max-width: 340px; }
  #hint .tapHint { font-size: 13px; color: #64748b; margin-top: 8px; }

  #flash {
    position: fixed; inset: 0; background: #ef4444; opacity: 0;
    pointer-events: none; z-index: 15;
  }
  #flash.active { opacity: 0.32; transition: opacity 0s; }
  #flash.fading { opacity: 0; transition: opacity 0.35s ease-out; }

  #victory {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.94);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; z-index: 30; color: #fff; text-align: center; padding: 24px;
  }
  #victory.show { display: flex; }
  #victory h1 { font-size: 30px; margin: 0; }
  #victory .medal { font-size: 48px; }
  #rematchBtn {
    background: #2563eb; color: #fff; border: none; padding: 14px 32px;
    border-radius: 12px; font-size: 17px; font-weight: 700;
  }
  #rematchBtn:active { background: #1d4ed8; }
</style>
</head>
<body>

  <div id="topbar">
    <div id="turnIndicator">
      <div id="turnDot"></div>
      <span id="turnLabel">Player 1</span>
    </div>
    <button id="restartBtn">Restart</button>
  </div>

  <div id="canvasWrap">
    <canvas id="track"></canvas>
  </div>

  <div id="hint">
    <h2>How to Race</h2>
    <p>
      Take turns drawing <strong>one quick stroke</strong> with your finger to move your car.
      Start each stroke exactly where your car stopped. Stay inside the road &mdash;
      touch a wall and you crash! First to cross the finish line wins.
    </p>
    <div class="tapHint">Tap anywhere to begin</div>
  </div>

  <div id="flash"></div>

  <div id="victory">
    <div class="medal">&#127942;</div>
    <h1 id="victoryText">Player 1 Wins!</h1>
    <button id="rematchBtn">Rematch</button>
  </div>

<script>
(function () {
  "use strict";

  // =========================================================================
  // CONFIG
  // =========================================================================
  const STROKE_DURATION_MS = 800;      // how long a single turn's stroke lasts
  const PLAYER_COLORS = ["#2563eb", "#dc2626"];   // player 1 blue, player 2 red
  const PLAYER_NAMES = ["Player 1", "Player 2"];

  // =========================================================================
  // GAME STATE MACHINE
  //   WAITING_FOR_TOUCH -> DRAWING -> (WAITING_FOR_TOUCH | GAME_OVER)
  // =========================================================================
  const STATE = { WAITING_FOR_TOUCH: "WAITING_FOR_TOUCH", DRAWING: "DRAWING", GAME_OVER: "GAME_OVER" };

  const game = {
    state: STATE.WAITING_FOR_TOUCH,
    currentPlayer: 0,                 // 0 or 1
    positions: [null, null],          // {x,y} current car position, null = must start in start zone
    strokes: [],                      // committed strokes: {player, points:[{x,y}], crashed}
    crashMarkers: [],                 // {x,y} visual crash markers
    currentStroke: null,              // in-progress stroke: {player, points:[{x,y}]}
    strokeStartTime: 0,
    activePointerId: null,
    winner: null,
    hintDismissed: false,
  };

  let track = null;   // generated track geometry (see TRACK GENERATION)
  let staticLayer = null; // offscreen canvas with the pre-rendered track art

  // =========================================================================
  // DOM
  // =========================================================================
  const canvas = document.getElementById("track");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  const turnDot = document.getElementById("turnDot");
  const turnLabel = document.getElementById("turnLabel");
  const restartBtn = document.getElementById("restartBtn");
  const hintEl = document.getElementById("hint");
  const flashEl = document.getElementById("flash");
  const victoryEl = document.getElementById("victory");
  const victoryText = document.getElementById("victoryText");
  const rematchBtn = document.getElementById("rematchBtn");

  let dpr = Math.max(1, window.devicePixelRatio || 1);
  let W = 0, H = 0; // canvas CSS-pixel dimensions

  // =========================================================================
  // GEOMETRY HELPERS
  // =========================================================================

  function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
  }

  // Catmull-Rom spline interpolation of a single scalar component.
  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t, t3 = t2 * t;
    return 0.5 * (
      (2 * p1) +
      (-p0 + p2) * t +
      (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
      (-p0 + 3 * p1 - 3 * p2 + p3) * t3
    );
  }

  // Returns intersection point + param t (along p1->p2) of two segments, or null.
  function segIntersect(p1, p2, p3, p4) {
    const d1x = p2.x - p1.x, d1y = p2.y - p1.y;
    const d2x = p4.x - p3.x, d2y = p4.y - p3.y;
    const denom = d1x * d2y - d1y * d2x;
    if (Math.abs(denom) < 1e-9) return null; // parallel
    const dx = p3.x - p1.x, dy = p3.y - p1.y;
    const t = (dx * d2y - dy * d2x) / denom;
    const u = (dx * d1y - dy * d1x) / denom;
    if (t < 0 || t > 1 || u < 0 || u > 1) return null;
    return { x: p1.x + t * d1x, y: p1.y + t * d1y, t };
  }

  // Ray-casting point-in-polygon test.
  function pointInPolygon(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].x, yi = poly[i].y;
      const xj = poly[j].x, yj = poly[j].y;
      const intersects = ((yi > pt.y) !== (yj > pt.y)) &&
        (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
      if (intersects) inside = !inside;
    }
    return inside;
  }

  // Finds the nearest intersection (smallest t) of segment p1->p2 against a
  // list of {p1,p2,type} candidate segments. When ignoreNearStart is set,
  // hits that land right on top of p1 are skipped -- this is only needed for
  // a stroke's very first segment, where p1 may sit exactly on a wall (e.g.
  // resuming from a crash point). Applying it to every segment would also
  // suppress genuine crossings during a slow stroke, whose segments are only
  // a pixel or two long, so callers must opt in per segment.
  function findNearestIntersection(p1, p2, segments, ignoreNearStart) {
    let best = null;
    for (const seg of segments) {
      const hit = segIntersect(p1, p2, seg.p1, seg.p2);
      if (!hit) continue;
      if (ignoreNearStart && dist(hit, p1) < 2.5) continue; // ignore self-hit at the stroke's origin
      if (!best || hit.t < best.t) best = { x: hit.x, y: hit.y, t: hit.t, type: seg.type };
    }
    return best;
  }

  // =========================================================================
  // TRACK GENERATION
  //   Built from a centerline (a handful of hand-placed anchor points along
  //   an S-curve) which is smoothed with a Catmull-Rom spline, then offset
  //   left/right by a per-point half-width to create the two track walls.
  // =========================================================================

  // Anchors: t = position along the track (0=start, 1=finish)
  //          a = lateral offset from center axis (-1..1)
  //          w = half-width as a fraction of the screen's smaller dimension
  const TRACK_ANCHORS = [
    { t: 0.00, a: 0.00, w: 0.095 },
    { t: 0.10, a: 0.20, w: 0.085 },
    { t: 0.20, a: 0.42, w: 0.045 },  // tight spot 1
    { t: 0.30, a: 0.15, w: 0.090 },
    { t: 0.40, a: -0.30, w: 0.080 },
    { t: 0.50, a: -0.45, w: 0.050 }, // tight spot 2
    { t: 0.60, a: -0.18, w: 0.100 },
    { t: 0.70, a: 0.28, w: 0.075 },
    { t: 0.80, a: 0.44, w: 0.045 },  // tight spot 3
    { t: 0.90, a: 0.12, w: 0.090 },
    { t: 1.00, a: 0.00, w: 0.080 },
  ];

  const SUBDIVISIONS_PER_SPAN = 12;
  const START_ZONE_FRACTION = 0.07;   // portion of the track length treated as the start zone
  const FINISH_BAND_FRACTION = 0.045; // portion of the track length used for the checkered stripe

  function generateTrack(width, height) {
    const minDim = Math.min(width, height);
    const portrait = height >= width;
    const margin = minDim * 0.10;
    const maxHalfWidthPx = 0.10 * minDim;

    // The "along" axis runs the long way (bottom->top in portrait, left->right
    // in landscape); the "across" axis is the perpendicular lateral axis.
    const alongLen = portrait ? height : width;
    const crossDim = portrait ? width : height;
    const crossCenter = crossDim / 2;
    const crossHalf = Math.max(10, crossCenter - margin - maxHalfWidthPx);

    function anchorToPoint(anchor) {
      const alongPos = portrait ? (alongLen - margin) - anchor.t * (alongLen - 2 * margin)
                                 : margin + anchor.t * (alongLen - 2 * margin);
      const crossPos = crossCenter + anchor.a * crossHalf;
      const x = portrait ? crossPos : alongPos;
      const y = portrait ? alongPos : crossPos;
      return { x, y, w: anchor.w * minDim };
    }

    const anchorPts = TRACK_ANCHORS.map(anchorToPoint);

    // Smooth the anchors into a dense centerline using Catmull-Rom splines.
    const centerline = [];
    const n = anchorPts.length;
    for (let i = 0; i < n - 1; i++) {
      const p0 = anchorPts[Math.max(i - 1, 0)];
      const p1 = anchorPts[i];
      const p2 = anchorPts[i + 1];
      const p3 = anchorPts[Math.min(i + 2, n - 1)];
      const steps = SUBDIVISIONS_PER_SPAN;
      const last = (i === n - 2) ? steps : steps - 1; // avoid duplicating shared endpoints
      for (let s = 0; s <= last; s++) {
        const t = s / steps;
        centerline.push({
          x: catmullRom(p0.x, p1.x, p2.x, p3.x, t),
          y: catmullRom(p0.y, p1.y, p2.y, p3.y, t),
          w: catmullRom(p0.w, p1.w, p2.w, p3.w, t),
        });
      }
    }

    // Offset left/right along the local normal to build the two walls.
    const left = [], right = [];
    const len = centerline.length;
    for (let i = 0; i < len; i++) {
      const prev = centerline[Math.max(i - 1, 0)];
      const next = centerline[Math.min(i + 1, len - 1)];
      let tx = next.x - prev.x, ty = next.y - prev.y;
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const nx = -ty, ny = tx; // perpendicular normal
      const p = centerline[i];
      left.push({ x: p.x + nx * p.w, y: p.y + ny * p.w });
      right.push({ x: p.x - nx * p.w, y: p.y - ny * p.w });
    }

    // Build wall segment lists for collision testing.
    const wallSegments = [];
    for (let i = 0; i < len - 1; i++) {
      wallSegments.push({ p1: left[i], p2: left[i + 1], type: "wall" });
      wallSegments.push({ p1: right[i], p2: right[i + 1], type: "wall" });
    }

    const finishSegment = { p1: left[len - 1], p2: right[len - 1], type: "finish" };

    const boundsSegments = [
      { p1: { x: 0, y: 0 }, p2: { x: width, y: 0 }, type: "bounds" },
      { p1: { x: width, y: 0 }, p2: { x: width, y: height }, type: "bounds" },
      { p1: { x: width, y: height }, p2: { x: 0, y: height }, type: "bounds" },
      { p1: { x: 0, y: height }, p2: { x: 0, y: 0 }, type: "bounds" },
    ];

    const startCount = Math.max(3, Math.round(len * START_ZONE_FRACTION));
    const startZonePolygon = left.slice(0, startCount)
      .concat(right.slice(0, startCount).reverse());

    const finishCount = Math.max(2, Math.round(len * FINISH_BAND_FRACTION));
    const finishBandPolygon = left.slice(len - finishCount)
      .concat(right.slice(len - finishCount).reverse());

    return {
      width, height, minDim,
      centerline, left, right,
      wallSegments, finishSegment, boundsSegments,
      startZonePolygon, finishBandPolygon,
      collisionSegments: wallSegments.concat([finishSegment], boundsSegments),
      startPoint: centerline[0],
    };
  }

  // =========================================================================
  // RENDERING
  // =========================================================================

  function buildStaticLayer() {
    staticLayer = document.createElement("canvas");
    staticLayer.width = canvas.width;
    staticLayer.height = canvas.height;
    const sctx = staticLayer.getContext("2d");
    sctx.scale(dpr, dpr);

    // paper background
    sctx.fillStyle = "#f8fafc";
    sctx.fillRect(0, 0, W, H);

    // road corridor
    const corridor = track.left.concat(track.right.slice().reverse());
    drawPolygonPath(sctx, corridor);
    sctx.fillStyle = "#dbeafe";
    sctx.fill();

    // start zone
    drawPolygonPath(sctx, track.startZonePolygon);
    sctx.fillStyle = "rgba(34, 197, 94, 0.55)";
    sctx.fill();

    // finish checker stripe, clipped to the finish band polygon
    sctx.save();
    drawPolygonPath(sctx, track.finishBandPolygon);
    sctx.clip();
    const xs = track.finishBandPolygon.map(p => p.x);
    const ys = track.finishBandPolygon.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const cell = Math.max(6, track.minDim * 0.018);
    for (let y = minY - cell; y < maxY + cell; y += cell) {
      for (let x = minX - cell; x < maxX + cell; x += cell) {
        const parity = (Math.floor(x / cell) + Math.floor(y / cell)) % 2;
        sctx.fillStyle = parity === 0 ? "#0f172a" : "#f8fafc";
        sctx.fillRect(x, y, cell, cell);
      }
    }
    sctx.restore();

    // walls
    const wallWidth = clamp(track.minDim * 0.016, 4, 10);
    sctx.lineWidth = wallWidth;
    sctx.lineCap = "round";
    sctx.lineJoin = "round";
    sctx.strokeStyle = "#0f172a";
    drawLinePath(sctx, track.left);
    sctx.stroke();
    drawLinePath(sctx, track.right);
    sctx.stroke();

    // labels
    sctx.fillStyle = "#14532d";
    sctx.font = `700 ${Math.round(clamp(track.minDim * 0.045, 14, 22))}px sans-serif`;
    sctx.textAlign = "center";
    sctx.textBaseline = "middle";
    const startCenter = centroid(track.startZonePolygon);
    sctx.fillText("START", startCenter.x, startCenter.y);
  }

  function drawPolygonPath(c, pts) {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
    c.closePath();
  }

  function drawLinePath(c, pts) {
    c.beginPath();
    c.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i].x, pts[i].y);
  }

  function centroid(pts) {
    let x = 0, y = 0;
    for (const p of pts) { x += p.x; y += p.y; }
    return { x: x / pts.length, y: y / pts.length };
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  function drawStroke(c, stroke, color, width) {
    if (stroke.points.length < 2) return;
    c.beginPath();
    c.moveTo(stroke.points[0].x, stroke.points[0].y);
    for (let i = 1; i < stroke.points.length; i++) c.lineTo(stroke.points[i].x, stroke.points[i].y);
    c.strokeStyle = color;
    c.lineWidth = width;
    c.lineCap = "round";
    c.lineJoin = "round";
    c.stroke();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    if (staticLayer) ctx.drawImage(staticLayer, 0, 0, W, H);

    const strokeWidth = clamp(track ? track.minDim * 0.013 : 5, 3, 8);

    // committed strokes
    for (const s of game.strokes) {
      drawStroke(ctx, s, PLAYER_COLORS[s.player], strokeWidth);
    }

    // crash markers
    for (const m of game.crashMarkers) {
      drawCrashMarker(m);
    }

    // in-progress stroke
    if (game.currentStroke) {
      drawStroke(ctx, game.currentStroke, PLAYER_COLORS[game.currentStroke.player], strokeWidth);
      drawTimeIndicator();
    }

    // player position dots (where the next stroke must begin)
    for (let p = 0; p < 2; p++) {
      const pos = game.positions[p];
      if (pos && !(game.currentStroke && game.currentStroke.player === p)) {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, strokeWidth * 0.9, 0, Math.PI * 2);
        ctx.fillStyle = PLAYER_COLORS[p];
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
      }
    }
  }

  function drawCrashMarker(pos) {
    const s = clamp(track.minDim * 0.02, 6, 14);
    ctx.save();
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(pos.x - s, pos.y - s); ctx.lineTo(pos.x + s, pos.y + s);
    ctx.moveTo(pos.x + s, pos.y - s); ctx.lineTo(pos.x - s, pos.y + s);
    ctx.stroke();
    ctx.restore();
  }

  function drawTimeIndicator() {
    const stroke = game.currentStroke;
    if (!stroke || stroke.points.length === 0) return;
    const last = stroke.points[stroke.points.length - 1];
    const elapsed = performance.now() - game.strokeStartTime;
    const remaining = clamp(1 - elapsed / STROKE_DURATION_MS, 0, 1);
    const maxR = clamp(track.minDim * 0.05, 18, 40);
    ctx.save();
    ctx.beginPath();
    ctx.arc(last.x, last.y, maxR * remaining, 0, Math.PI * 2);
    ctx.strokeStyle = PLAYER_COLORS[stroke.player];
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  // =========================================================================
  // INPUT HANDLING
  //   Pointer Events unify mouse + touch so the same code path drives both.
  // =========================================================================

  function getRelativePos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function onPointerDown(e) {
    if (!game.hintDismissed) return; // hint overlay eats the very first touch
    if (game.state === STATE.GAME_OVER) return;
    if (game.state === STATE.DRAWING) return; // ignore extra fingers

    const pos = getRelativePos(e);
    const required = game.positions[game.currentPlayer];

    if (required === null) {
      if (!pointInPolygon(pos, track.startZonePolygon)) return; // ignored: outside start zone
    } else {
      const tolerance = clamp(track.minDim * 0.06, 24, 60);
      if (dist(pos, required) > tolerance) return; // ignored: too far from car
    }

    const startPoint = required === null ? pos : { x: required.x, y: required.y }; // snap exactly

    game.state = STATE.DRAWING;
    game.currentStroke = { player: game.currentPlayer, points: [startPoint] };
    game.strokeStartTime = performance.now();
    game.activePointerId = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* no-op */ }
  }

  function onPointerMove(e) {
    if (game.state !== STATE.DRAWING) return;
    if (e.pointerId !== game.activePointerId) return;

    const pos = getRelativePos(e);
    const stroke = game.currentStroke;
    const from = stroke.points[stroke.points.length - 1];
    const isFirstSegment = stroke.points.length === 1;

    const hit = findNearestIntersection(from, pos, track.collisionSegments, isFirstSegment);
    if (hit) {
      stroke.points.push({ x: hit.x, y: hit.y });
      endStroke(hit.type === "finish" ? "win" : "crash");
      return;
    }
    stroke.points.push(pos);
  }

  function onPointerUp(e) {
    if (game.state !== STATE.DRAWING) return;
    if (e.pointerId !== game.activePointerId) return;
    endStroke("normal");
  }

  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);

  // Belt-and-suspenders against page scroll/zoom/rubber-banding on iOS.
  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });

  hintEl.addEventListener("pointerdown", function () {
    game.hintDismissed = true;
    hintEl.style.display = "none";
  });

  // =========================================================================
  // GAME LOGIC
  // =========================================================================

  function endStroke(reason) {
    const stroke = game.currentStroke;
    const lastPoint = stroke.points[stroke.points.length - 1];
    stroke.crashed = (reason === "crash");
    game.strokes.push(stroke);
    game.positions[stroke.player] = lastPoint;

    if (reason === "win") {
      game.state = STATE.GAME_OVER;
      game.winner = stroke.player;
      game.currentStroke = null;
      showVictory(stroke.player);
      render();
      return;
    }

    if (reason === "crash") {
      game.crashMarkers.push({ x: lastPoint.x, y: lastPoint.y });
      flashScreen();
      if (navigator.vibrate) navigator.vibrate(80);
    }

    game.currentStroke = null;
    game.activePointerId = null;
    game.currentPlayer = 1 - game.currentPlayer;
    game.state = STATE.WAITING_FOR_TOUCH;
    updateTopBar();
  }

  function flashScreen() {
    flashEl.classList.remove("fading");
    flashEl.classList.add("active");
    requestAnimationFrame(function () {
      setTimeout(function () {
        flashEl.classList.remove("active");
        flashEl.classList.add("fading");
      }, 60);
    });
  }

  function updateTopBar() {
    const p = game.currentPlayer;
    turnDot.style.background = PLAYER_COLORS[p];
    turnDot.style.color = PLAYER_COLORS[p];
    turnLabel.textContent = PLAYER_NAMES[p] + "'s turn";
  }

  function showVictory(player) {
    turnDot.style.background = PLAYER_COLORS[player];
    turnDot.style.color = PLAYER_COLORS[player];
    turnLabel.textContent = PLAYER_NAMES[player] + " wins!";
    victoryText.textContent = PLAYER_NAMES[player] + " Wins!";
    victoryText.style.color = PLAYER_COLORS[player];
    victoryEl.classList.add("show");
  }

  function resetGame() {
    game.state = STATE.WAITING_FOR_TOUCH;
    game.currentPlayer = 0;
    game.positions = [null, null];
    game.strokes = [];
    game.crashMarkers = [];
    game.currentStroke = null;
    game.activePointerId = null;
    game.winner = null;
    victoryEl.classList.remove("show");
    flashEl.classList.remove("active", "fading");
    updateTopBar();
    render();
  }

  restartBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); resetGame(); });
  rematchBtn.addEventListener("pointerdown", function (e) { e.stopPropagation(); resetGame(); });

  // =========================================================================
  // INIT / RESIZE / MAIN LOOP
  // =========================================================================

  function resize() {
    dpr = Math.max(1, window.devicePixelRatio || 1);
    const rect = canvasWrap.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    track = generateTrack(W, H);
    buildStaticLayer();
    resetGame(); // geometry changed (e.g. rotation) -- restart for a consistent state
  }

  let resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  function loop() {
    if (game.state === STATE.DRAWING) {
      const elapsed = performance.now() - game.strokeStartTime;
      if (elapsed >= STROKE_DURATION_MS) {
        endStroke("normal"); // time's up -- stroke ends where the finger currently is
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  resize();
  updateTopBar();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
